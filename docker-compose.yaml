
services:

  space-service:
    build:
      context: ./space-service
      dockerfile: Dockerfile
    container_name: coworking-space-service
    ports:
      - "9010:9010"
    environment:
      SERVER_PORT: 9010
      SPRING_DATASOURCE_URL: ${SPACE_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${SPACE_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPACE_DB_PASSWORD}
    restart: unless-stopped
    networks:
      - coworking-network

  booking-service:
    build:
      context: ./booking-service
      dockerfile: Dockerfile
    container_name: coworking-booking-service
    ports:
      - "9020:9020"
    environment:
      SERVER_PORT: 9020
      SPRING_DATASOURCE_URL: ${BOOKING_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${BOOKING_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${BOOKING_DB_PASSWORD}
      SPACE_SERVICE_URL: http://space-service:9010
    restart: unless-stopped
    networks:
      - coworking-network

networks:
  coworking-network:
    driver: bridge
